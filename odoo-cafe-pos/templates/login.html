<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Odoo Café POS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-box glass-card">
      <a href="/" class="logo" style="justify-content:center; margin-bottom:18px;">☕ Odoo<span>Café</span></a>

      <div id="formTitle">
        <h2>Welcome back</h2>
        <p class="sub">Sign in to manage your café</p>
      </div>

      <div class="alert alert-error" id="errorAlert"></div>
      <div class="alert alert-success" id="successAlert"></div>

      <!-- Tabs -->
      <div class="role-tabs" id="modeTabs">
        <button class="role-tab active" data-mode="login">Login</button>
        <button class="role-tab" data-mode="register">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" id="regName" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select class="form-control" id="regRole">
            <option value="customer">Customer</option>

          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>



      <div class="auth-switch">
        <a href="/">← Back to home</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
  <script>
    const tabs = document.querySelectorAll('.role-tab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const mode = tab.dataset.mode;
        hideAlerts();
        if (mode === 'login') {
          loginForm.style.display = 'block';
          registerForm.style.display = 'none';
          formTitle.innerHTML = '<h2>Welcome back</h2><p class="sub">Sign in to manage your café</p>';
        } else {
          loginForm.style.display = 'none';
          registerForm.style.display = 'block';
          formTitle.innerHTML = '<h2>Create your account</h2><p class="sub">Join the Odoo Café POS system</p>';
        }
      });
    });

    function hideAlerts() {
      document.getElementById('errorAlert').classList.remove('show');
      document.getElementById('successAlert').classList.remove('show');
    }
    function showError(msg) {
      hideAlerts();
      const el = document.getElementById('errorAlert');
      el.textContent = msg;
      el.classList.add('show');
    }
    function showSuccess(msg) {
      hideAlerts();
      const el = document.getElementById('successAlert');
      el.textContent = msg;
      el.classList.add('show');
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        const data = await api('/api/auth/login', { method: 'POST', body: { email, password } });
        showSuccess('Login successful! Redirecting...');
        setTimeout(() => {
          if (data.user.role === 'admin') window.location.href = '/dashboard';
          else if (data.user.role === 'employee') window.location.href = '/pos';
          else window.location.href = '/customer-dashboard';
        }, 800);
      } catch (err) {
        showError(err.message);
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;
      try {
        await api('/api/auth/register', { method: 'POST', body: { name, email, password, role } });
        showSuccess('Account created! You can now log in.');
        setTimeout(() => {
          tabs[0].click();
          document.getElementById('loginEmail').value = email;
        }, 800);
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>

</html>
